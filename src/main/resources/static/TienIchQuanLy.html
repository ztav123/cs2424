<!DOCTYPE html>
<html lang="vi">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>pos thu ngân - 1440:1024</title>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Đảm bảo body chiếm trọn màn hình JavaFX */
        body { 
            background-color: #2c3338; 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        .pos-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #eaf1f7;
            gap: 20px; 
            padding: 20px;
        }
        
        .header { 
            background-color: #0b5aa6; 
            color: white; 
            border-radius: 12px; 
            padding: 0 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0; 
            height: 80px; 
        }

        .header-left { display: flex; align-items: center; gap: 20px; height: 100%;}
        .logo-container { height: 70%; display: flex; align-items: center; background: white; border-radius: 8px; padding: 5px; }
        .logo-container img { max-height: 100%; object-fit: contain; }
        .user-info { display: flex; flex-direction: column; justify-content: center;}
        .user-info span:first-child { font-size: 0.8rem; opacity: 0.8; }
        .user-info span:last-child { font-weight: bold; font-size: 1.1rem; }
        
        .header-right { display: flex; align-items: center; gap: 40px; }
        .datetime { font-weight: bold; font-size: 1.1rem; min-width: 220px; text-align: right;} 
        
        /* Main container điều phối không gian */
        .main-container { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            justify-content: center; 
            align-items: stretch; /* Ép các con cao bằng nhau */
            gap: 25px;
        }

        .side-banner {
            flex: 1; /* Chiếm 1 phần */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .side-banner img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        /* Widget Grid - Phần quan trọng nhất */
        .widget-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 25px;
            flex: 2; /* Chiếm 2 phần (rộng gấp đôi banner) */
            aspect-ratio: 1 / 1; /* Giữ khung vuông */
            max-height: 100%; /* Không được cao quá main-container */
        }

        .widget-box {
            position: relative;
            overflow: hidden;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #0b5aa6;
            cursor: pointer;
            transition: all 0.2s ease;
            
            /* SỬA LỖI: Cố định kích thước box */
            width: 100%;
            height: 100%;
        }

        .widget-box:active { transform: scale(0.96); }

        .widget-text {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .widget-slide-img {
            padding: 15%;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            transition: top 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .widget-slide-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .widget-box.active .widget-slide-img {
            top: 0;
        }
      </style>
   </head>
   <body>
      <div class="pos-wrapper">
         <header class="header">
            <div class="header-left">
               <div class="logo-container"><img src=".\img\logo.png" alt="Logo"></div>
               <div class="user-info"><span>ID: 001</span><span>Tên: Quản trị viên</span></div>
            </div>
            <div class="header-right">
               <div class="datetime" id="live-clock">đang tải...</div>
               <div class="action-icon" id="btn-thoat" style="cursor:pointer; font-size: 1.5rem;">🚪</div>
            </div>
         </header>
         
         <main class="main-container">
            <!-- Banner Trái -->
            <div class="side-banner">
                <img src=".\img\angel.png" alt="Banner Left" style="transform: scaleX(-1);">
            </div>

            <!-- Grid Trung tâm -->
            <div class="widget-grid">
                <div class="widget-box" onclick="this.classList.toggle('active')">
                    <span class="widget-text">Xem hóa đơn</span>
                    <div class="widget-slide-img">
                        <img src=".\img\HoaDon.png" alt="Invoice">
                    </div>
                </div>
                <div class="widget-box" onclick="this.classList.toggle('active')">
                    <span class="widget-text">Báo cáo</span>
                    <div class="widget-slide-img">
                        <img src=".\img\Report.png" alt="Report">
                    </div>
                </div>
                <div class="widget-box" onclick="this.classList.toggle('active')">
                    <span class="widget-text">Nhập kho</span>
                    <div class="widget-slide-img">
                        <img src=".\img\Warehouse.png" alt="Warehouse">
                    </div>
                </div>
                <div class="widget-box" onclick="this.classList.toggle('active')">
                    <span class="widget-text">Nhân sự</span>
                    <div class="widget-slide-img">
                        <img src=".\img\HR.png" alt="HR">
                    </div>
                </div>
            </div>

            <!-- Banner Phải -->
            <div class="side-banner">
                <img src=".\img\angel.png" alt="Banner Right">
            </div>
         </main>
      </div>

      <script>
        document.getElementById('btn-thoat').addEventListener('click', function() {
            window.location.href = 'login.html';
        });

        function updateDateTime() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const dateNumber = now.getDate();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeString = `${dayName} ${monthName} ${dateNumber} ${hours}:${minutes}:${seconds}`;
            document.getElementById('live-clock').textContent = timeString;
        }
        setInterval(updateDateTime, 1000); 
        updateDateTime();   
      </script>
   </body>
</html>
