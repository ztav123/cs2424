<!DOCTYPE html>
<html lang="vi">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>pos thu ngân - 1440:1024</title>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #2c3338; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .pos-wrapper {
            aspect-ratio: 1440 / 1024;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #eaf1f7;
            gap: 3%; 
            padding: 2%;
        }
        
        .header { background-color: #0b5aa6; color: white; border-radius: 12px; padding: 1% 2%; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; height: 8%; }
        .header-left { display: flex; align-items: center; gap: 20px; height: 100%;}
        .logo-container { height: 100%; display: flex; align-items: center; background: white;  border-radius: 8px; }
        .logo-container img { max-height: 100%; max-width: 367px; object-fit: contain; }
        .user-info { display: flex; flex-direction: column; justify-content: center;}
        .user-info span:first-child { font-size: 0.9rem; opacity: 0.8; }
        .user-info span:last-child { font-weight: bold; font-size: 1.2rem; }
        .header-right { display: flex; align-items: center; gap: 40px; }
        .header-actions { display: flex; gap: 25px; }
        .action-icon { display: flex; flex-direction: column; align-items: center; font-size: 0.9rem; cursor: pointer; }
        .datetime { font-weight: bold; font-size: 1.2rem; min-width: 220px; text-align: right;} 
        
        .main-container { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            justify-content: space-between; 
            align-items: center; 
            gap: 2%;
        }

        .side-banner {
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .side-banner img {
            width: 88%;
            height: 88%;
            object-fit: contain;
        }

        .widget-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 40px;
            flex: 0 0 50%;
            max-height: 100%;
            aspect-ratio: 1 / 1;
        }

        .widget-box {
            position: relative;
            overflow: hidden;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: #0b5aa6;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .widget-box:active {
            transform: scale(0.98);
        }

        .widget-text {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .widget-slide-img {
            padding: 10%;
            position: absolute;
            top: 100%;
            text-align: center;
            width: 100%;
            height: 100%;
            background-color: white;
            transition: top 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 3;
        }

        .widget-slide-img img {
            width: 88%;
            height: 88%;
            object-fit: contain;
            margin: auto
        }

        .widget-box.active .widget-slide-img {
            top: 0;
        }
      </style>
   </head>
   <body>
      <div class="pos-wrapper">
         <header class="header">
            <div class="header-left">
               <div class="logo-container"><img src=".\img\logo.png" alt="CS24H Logo"></div>
               <div class="user-info"><span>ID:</span><span>TÊN:</span></div>
            </div>
            <div class="header-right">
               <div class="header-actions">
                  <div class="action-icon" id="btn-thoat"><span>🚪</span><span>Thoát</span></div>

               </div>
               <div class="datetime" id="live-clock">đang tải...</div>
            </div>
         </header>
         
         <main class="main-container">
            <div class="side-banner">
                <img src=".\img\angel.png" alt="Banner Left Placeholder">
            </div>

            <div class="widget-grid">
                <div class="widget-box" onclick="this.classList.toggle('active')">
                    <span class="widget-text">Xem hóa đơn</span>
                    <div class="widget-slide-img">
                        <img src=".\img\HoaDon.png" alt="Ảnh Xem hóa đơn">
                    </div>
                </div>
                <div class="widget-box" onclick="this.classList.toggle('active')">
                    <span class="widget-text">Báo cáo</span>
                    <div class="widget-slide-img">
                        <img src=".\img\Report.png" alt="Ảnh Báo cáo">
                    </div>
                </div>
                <div class="widget-box" onclick="this.classList.toggle('active')">
                    <span class="widget-text">Nhập kho</span>
                    <div class="widget-slide-img">
                        <img src=".\img\Warehouse.png" alt="Ảnh Nhập kho">
                    </div>
                </div>
                <div class="widget-box" onclick="this.classList.toggle('active')">
                    <span class="widget-text">Nhân sự</span>
                    <div class="widget-slide-img">
                        <img src=".\img\HR.png" alt="Ảnh Nhân sự">
                    </div>
                </div>
            </div>

            <div class="side-banner">
                <img src=".\img\angel.png" alt="Banner Right Placeholder">
            </div>
         </main>
      </div>

      <script>
        document.getElementById('btn-thoat').addEventListener('click', function() {
        // Xóa thông tin quản lý khỏi localStorage nếu cần
        localStorage.removeItem('currentQuanLyId');
        localStorage.removeItem('currentQuanLyName');
        window.location.href = 'login.html';
    });
        function updateDateTime() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const dateNumber = now.getDate();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeString = `${dayName} ${monthName} ${dateNumber} ${hours}:${minutes}:${seconds}`;
            document.getElementById('live-clock').textContent = timeString;
        }
        setInterval(updateDateTime, 1000); 
        updateDateTime();
      </script>
   </body>
</html>
